name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "version string (default 0.0.0-1)"
        required: false
        default: "0.0.0-ci"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v="0.0.0-${GITHUB_RUN_NUMBER}"
          fi
          v=$(printf '%s' "$v" | tr -cd '0-9.-' | sed -E 's/^[.-]+//; s/[.-]+$//')
          if ! [[ "$v" =~ ^[0-9]+(\.[0-9]+)*(-[0-9]+)?$ ]]; then
            echo "::warning::bad version '$v' -> using 0.0.0-${GITHUB_RUN_NUMBER}"
            v="0.0.0-${GITHUB_RUN_NUMBER}"
          fi
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Host tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq patchelf file curl python3 dpkg

      - name: Cache Debian debs
        uses: actions/cache@v4
        with:
          path: .work/debs
          key: debs-${{ hashFiles('build.sh') }}
          restore-keys: debs-

      - name: Build
        env:
          PKG_VERSION: ${{ steps.ver.outputs.v }}
          REUSE_DEBS: "1"
        run: |
          chmod +x build.sh tools/make_icons.py
          ./build.sh

      - name: Verify + checksum
        run: |
          spk=$(ls dist/*.spk)
          if [ "$(head -c2 "$spk" | od -An -tx1 | tr -d ' ')" = "1f8b" ]; then
            echo "ERROR: .spk is gzipped; DSM expects a plain tar"; exit 1
          fi
          tar -tf "$spk" | grep -qx INFO
          tar -tf "$spk" | grep -qx package.tgz
          tar -tf "$spk" | grep -qx PACKAGE_ICON.PNG
          tar -tf "$spk" | grep -qx PACKAGE_ICON_256.PNG
          mkdir -p /tmp/info && tar -xf "$spk" -C /tmp/info INFO
          grep -Eq '^version="[0-9]+(\.[0-9]+)*(-[0-9]+)?"' /tmp/info/INFO
          tar -xf "$spk" -C /tmp package.tgz
          tar -tzf /tmp/package.tgz | grep -q '^./bin/usr/bin/chromium$'
          sha256sum "$spk" | tee "$spk.sha256"
          echo "spk=$spk" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSMBrowser-spk
          path: |
            dist/*.spk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.spk
            dist/*.sha256
          generate_release_notes: true
